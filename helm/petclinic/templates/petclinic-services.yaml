{{- range $name, $service := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
spec:
  replicas: {{ $.Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.aws.ecrRegistry }}/{{ $service.image }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}

          {{- if ne $name "config-server" }}
          env:
            - name: CONFIG_SERVER_URL
              value: "http://config-server:8888/"
          {{- end }}

          ports:
            - containerPort: {{ $service.port }}

          readinessProbe:
            tcpSocket:
              port: {{ $service.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6

          resources:
{{ toYaml $.Values.resources | nindent 12 }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
spec:
  selector:
    app: {{ $name }}
  ports:
    - port: {{ $service.port }}
      targetPort: {{ $service.port }}
      protocol: TCP
  type: {{ $.Values.service.type }}

{{- end }}
