apiVersion: apps/v1
kind: Deployment
metadata:
  name: customers-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customers-service
  template:
    metadata:
      labels:
        app: customers-service
    spec:
      containers:
        - name: customers-service
          image: 866481181845.dkr.ecr.us-east-1.amazonaws.com/petclinic-customers-service:latest

          env:
            - name: CONFIG_SERVER_URL
              value: "http://config-server:8888/"

          ports:
            - containerPort: 8081

          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: customers-service
spec:
  selector:
    app: customers-service
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP
